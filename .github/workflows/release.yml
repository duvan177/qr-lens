name: Release

on:
  push:
    branches: [main]
  # Prerelease manual de una rama con changesets pendientes:
  # gh workflow run release.yml --ref main -f ref=<rama>
  workflow_dispatch:
    inputs:
      ref:
        description: Rama a publicar con la etiqueta next
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Pinned to a major:
      # npm@latest can require a newer Node than the runner has (npm 12 needs
      # Node >= 22.22) and break the release.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Va en este archivo y no en uno propio porque la publicación con OIDC está
  # ligada en npm a release.yml. No toca `latest` ni sube cambios al repositorio.
  prerelease:
    name: Prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Pinned to a major:
      # npm@latest can require a newer Node than the runner has (npm 12 needs
      # Node >= 22.22) and break the release.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Version snapshot
        run: npx changeset version --snapshot next

      - name: Build
        run: npm run build

      - name: Publish with the next tag
        run: npx changeset publish --tag next --no-git-tag
